<!DOCTYPE html>
<html>
    <head>
        <title>
            RPG V1.0
        </title>
    </head>

    <body>
        <h1>RPG V1.0</h1>
        <script>

            const heroName = "Deathfist";
            const homeWorld = "Ironhollow";
            const baseClass = "Warrior";

            let currentHealth = 100
            let experiencePoints = 0

            console.log("Hero: ", heroName);
            console.log("Homeworld: ", homeWorld);
            console.log("Class: ", baseClass);

            console.log("HP: ", currentHealth);
            console.log("XP: ", experiencePoints);

            let powerLevel = (currentHealth * 0.5) + (experiencePoints * 10);
            console.log("Starting PowerLevel: ", powerLevel);

            currentHealth += 20;
            experiencePoints += 50;

            powerLevel = (currentHealth * 0.5) + (experiencePoints * 10);

            console.log("New HP: ", currentHealth);

            console.log("New XP: ", experiencePoints);

            console.log("New PowerLevel: ", powerLevel);

        </script>
    </body>
</html>
