<!DOCTYPE html>
<html>
    <head>
        <title>
            RPG V1.0
        </title>
    </head>

    <body>
        <h1>RPG V1.0</h1>
        <script>

            const heroName = "Deathfist";
            const homeWorld = "Ironhollow";
            const baseClass = "Warrior";

            let currentHealth = 100
            let experiencePoints = 0

            console.log("Hero: ", heroName);
            console.log("Homeworld: ", homeWorld);
            console.log("Class: ", baseClass);

            console.log("HP: ", currentHealth);
            console.log("XP: ", experiencePoints);

            let powerLevel = (currentHealth * 0.5) + (experiencePoints * 10);
            console.log("Starting PowerLevel: ", powerLevel);

            currentHealth += 20;
            experiencePoints += 50;

            powerLevel = (currentHealth * 0.5) + (experiencePoints * 10);

            console.log("New HP: ", currentHealth);

            console.log("New XP: ", experiencePoints);

            console.log("New PowerLevel: ", powerLevel);

            for (let day = 1; day <=5; day++) {
                experiencePoints += 20;
                console.log("Day: ", day, "- Training hard... XP is now", experiencePoints);
            }

            console.log("Updated XP: ", experiencePoints);

            let bossHealth = 100;

            while (currentHealth > 0 && bossHealth > 0) {
                bossHealth -= 35;
                currentHealth -=35;
                console.log("Hero HP: ", currentHealth, "Boss HP: ", bossHealth);
            }

            if (currentHealth <= 0 && bossHealth <= 0) {
                console.log("Both go down!");
            }

            else if (bossHealth <=0) {
                console.log("Hero wins!");
            }
            else {
                console.log("Boss wins!")
            }

        </script>
    </body>
</html>
